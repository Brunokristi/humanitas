<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanitas Loader Test</title>

    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #fbf9f3;
            color: #335940;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .demo {
            width: min(100%, 520px);
            padding: 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 18px 50px rgba(51, 89, 64, 0.12);
            text-align: center;
        }

        .loader-wrap {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
        }

        .loader-object {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .status-label {
            min-height: 24px;
            margin: 0 0 24px;
            font-size: 16px;
            font-weight: 700;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        button {
            min-height: 46px;
            padding: 12px 16px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 180ms ease,
                opacity 180ms ease,
                box-shadow 180ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(51, 89, 64, 0.14);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        .loading-button {
            background: #e8e2d6;
            color: #335940;
        }

        .success-button {
            background: #335940;
            color: #ffffff;
        }

        .error-button {
            background: #9f4f4f;
            color: #ffffff;
        }

        .automatic-test {
            width: 100%;
            margin-top: 12px;
            background: transparent;
            color: #335940;
            border: 1px solid rgba(51, 89, 64, 0.22);
        }

        @media (max-width: 480px) {
            .demo {
                padding: 24px 18px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="demo">
        <div class="loader-wrap">
            <object
                id="humanitasLoader"
                class="loader-object"
                data="./humanitas_loader_states.svg"
                type="image/svg+xml"
                aria-label="Humanitas loader"
            ></object>
        </div>

        <p id="statusLabel" class="status-label">Loading</p>

        <div class="controls">
            <button
                class="loading-button"
                type="button"
                data-state="loading"
            >
                Loading
            </button>

            <button
                class="success-button"
                type="button"
                data-state="success"
            >
                Success
            </button>

            <button
                class="error-button"
                type="button"
                data-state="error"
            >
                Error
            </button>
        </div>

        <button
            id="automaticTest"
            class="automatic-test"
            type="button"
        >
            Run automatic test
        </button>
    </main>

    <script>
        const loaderObject = document.getElementById('humanitasLoader');
        const statusLabel = document.getElementById('statusLabel');
        const automaticTestButton = document.getElementById('automaticTest');
        const stateButtons = document.querySelectorAll('[data-state]');

        let automaticTimers = [];

        const stateLabels = {
            loading: 'Loading',
            success: 'Success',
            error: 'Error'
        };

        const clearAutomaticTest = () => {
            automaticTimers.forEach((timer) => {
                window.clearTimeout(timer);
            });

            automaticTimers = [];
        };

        const getLoaderApi = () => {
            return loaderObject.contentWindow?.humanitasLoader ?? null;
        };

        const setLoaderState = (state) => {
            const loaderApi = getLoaderApi();

            if (!loaderApi) {
                console.warn('The SVG loader is not ready yet.');
                return false;
            }

            loaderApi.setState(state);
            statusLabel.textContent = stateLabels[state] ?? state;
            return true;
        };

        loaderObject.addEventListener('load', () => {
            setLoaderState('loading');
        });

        stateButtons.forEach((button) => {
            button.addEventListener('click', () => {
                clearAutomaticTest();
                setLoaderState(button.dataset.state);
            });
        });

        automaticTestButton.addEventListener('click', () => {
            clearAutomaticTest();
            setLoaderState('loading');

            automaticTimers.push(
                window.setTimeout(() => {
                    setLoaderState('success');
                }, 2200)
            );

            automaticTimers.push(
                window.setTimeout(() => {
                    setLoaderState('loading');
                }, 4400)
            );

            automaticTimers.push(
                window.setTimeout(() => {
                    setLoaderState('error');
                }, 6600)
            );
        });
    </script>
</body>
</html>
